_comment_: "Synthetic regime-switch experiment config. Compares the proposed hierarchical transformer router against the MLP-pool baseline."
parquet_path: "data/processed/synthetic_regime_switch/combined_features.parquet"
skip_rover: true
shared:
  train_ratio: 0.8
  val_ratio: 0.1
  max_seq_len: 256
  batch_size: 32
  num_workers: 4
  max_epochs: 2
  learning_rate: 1e-4
  weight_decay: 1e-2
  warmup_steps: 200
  primary_weight: 1.0
  aux_ce_weight: 0.0
  soft_ce_weight: 0.5
  soft_ce_temperature: 0.1
  seed: 42

methods:
  - name: "synthetic_regime_switch_hier"
    arch: "hierarchical_transformer"
    d_model: 256
    n_heads: 4
    stage1_layers: 2
    stage2_layers: 1
    ffn_dim: 512
    dropout: 0.15

  - name: "synthetic_regime_switch_mlp_pool"
    arch: "mlp_pool"
    mlp_hidden: 1024
    mlp_layers: 2
    dropout: 0.15
