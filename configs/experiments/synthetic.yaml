experiment_metadata:
  name: synthetic
  parent: null
  status: deprecated
  created: 2026-04-26
  author: huseyin-karaca
  deprecated_for: synthetic_v2

  interpretation: |
    First scaffold of the synthetic regime-switch experiment. We
    generated a regime-switch parquet (R=4 regimes, T=128 frames per
    clip, asymmetric per-(r1,r2,k) WER table) and trained both the
    proposed hierarchical transformer router and the MLP-pool
    baseline against it for two epochs each. Convergence and pipeline
    plumbing were the targets, not manuscript numbers.

  rationale: |
    Manuscript Section 4.1 needs (a) a single-R test result confirming
    that frame-level routing beats pooled routing, and (b) a sweep
    over R that quantifies how the temporal-modeling advantage scales.
    This v1 file was sized for a smoke run (max_epochs=2) and inherits
    several reasonable-sounding values from configs/config.yaml that
    were actually tuned for AMI (precision, eager_load, etc.). It is
    insufficient for the manuscript Tab. I.

  hypothesis: |
    Smoke-only. Hypothesis testing happens in the v2 successor.

# ---------------------------------------------------------------------------

_comment_: "Synthetic regime-switch experiment config. Compares the proposed hierarchical transformer router against the MLP-pool baseline."
parquet_path: "data/processed/synthetic_regime_switch/combined_features.parquet"
skip_rover: true
shared:
  train_ratio: 0.8
  val_ratio: 0.1
  max_seq_len: 256
  batch_size: 32
  num_workers: 4
  max_epochs: 2
  learning_rate: 1e-4
  weight_decay: 1e-2
  warmup_steps: 200
  primary_weight: 1.0
  aux_ce_weight: 0.0
  soft_ce_weight: 0.5
  soft_ce_temperature: 0.1
  seed: 42

methods:
  - name: "synthetic_regime_switch_hier"
    arch: "hierarchical_transformer"
    d_model: 256
    n_heads: 4
    stage1_layers: 2
    stage2_layers: 1
    ffn_dim: 512
    dropout: 0.15

  - name: "synthetic_regime_switch_mlp_pool"
    arch: "mlp_pool"
    mlp_hidden: 1024
    mlp_layers: 2
    dropout: 0.15
