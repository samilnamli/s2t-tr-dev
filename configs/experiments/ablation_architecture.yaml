experiment_metadata:
  name: ablation_architecture
  parent: null
  status: deprecated
  created: 2026-05-01
  author: huseyin-karaca
  deprecated_for: ablation_architecture_v2

  interpretation: |
    First version of the architecture ablation on AMI. Toggles the
    cross-attention bridge (no_cross_attention=true), Stage-1 weight
    sharing (separate_stage1=true), and includes the MLP-pool baseline
    for completeness. Single seed (42) per row.

  rationale: |
    Insufficient for Tab. IV as written. The manuscript table has 8
    rows: Default, -bridge, -shared Stage 1, ell_stage1=1, ell_stage1=4,
    ell_stage2=2, d=128, d=512. The v1 file only covers 3 of those
    (Default + -bridge + -shared Stage 1) plus the MLP-pool baseline
    that is duplicated from the main results. The depth/width sweep
    (5 missing rows) is not covered anywhere.

  hypothesis: |
    Superseded by v2.

# ---------------------------------------------------------------------------

_comment_: "Architecture ablation. Tests the impact of the cross-attention bridge and shared stage-1 weights."
parquet_path: "data/processed/edinburghcstr_ami/combined_features_with_transcripts.parquet"
skip_rover: true
shared:
  train_ratio: 0.8
  val_ratio: 0.1
  max_seq_len: 2000
  batch_size: 128
  num_workers: 4
  max_epochs: 50
  learning_rate: 1e-4
  precision: "bf16-mixed"
  eager_load: true
  allow_tf32: false
  test_average_epochs: 1
  early_stopping_patience: 8
  primary_weight: 1.0
  aux_ce_weight: 0.3
  soft_ce_weight: 0.5
  soft_ce_temperature: 1.5
  class_balanced_loss: true

methods:
  - name: "hierarchical_proposed"
    arch: "hierarchical_transformer"
    no_cross_attention: false
    separate_stage1: false
    seed: [42]

  - name: "hierarchical_no_cross_attn"
    arch: "hierarchical_transformer"
    no_cross_attention: true
    separate_stage1: false
    seed: [42]

  - name: "hierarchical_separate_stage1"
    arch: "hierarchical_transformer"
    no_cross_attention: false
    separate_stage1: true
    seed: [42]

  - name: "mlp_pool_baseline"
    arch: "mlp_pool"
    seed: [42]
