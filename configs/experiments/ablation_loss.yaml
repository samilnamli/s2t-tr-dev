_comment_: "Loss ablation. Tests the impact of the primary weighted WER loss, hard CE, and soft CE."
parquet_path: "data/processed/edinburghcstr_ami/combined_features_with_transcripts.parquet"
skip_rover: true
shared:
  train_ratio: 0.8
  val_ratio: 0.1
  max_seq_len: 2000
  batch_size: 128
  num_workers: 4
  max_epochs: 50
  learning_rate: 1e-4
  precision: "bf16-mixed"
  eager_load: true
  allow_tf32: false
  test_average_epochs: 1
  early_stopping_patience: 8
  arch: "hierarchical_transformer"
  class_balanced_loss: true

methods:
  - name: "loss_proposed"
    primary_weight: 1.0
    aux_ce_weight: 0.3
    soft_ce_weight: 0.5
    soft_ce_temperature: 1.5
    seed: [42]

  - name: "loss_primary_only"
    primary_weight: 1.0
    aux_ce_weight: 0.0
    soft_ce_weight: 0.0
    seed: [42]

  - name: "loss_hard_ce_only"
    primary_weight: 0.0
    aux_ce_weight: 1.0
    soft_ce_weight: 0.0
    seed: [42]

  - name: "loss_soft_ce_only"
    primary_weight: 0.0
    aux_ce_weight: 0.0
    soft_ce_weight: 1.0
    soft_ce_temperature: 1.5
    seed: [42]
