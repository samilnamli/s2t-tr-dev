# AMI main-results experiment config.
#
# Hypothesis (from manuscript):
#   single best model    WER ~0.40
#   random / w-random    WER ~0.40
#   ROVER / w-ROVER      WER ~0.35–0.37
#   MLP-pool baseline    WER ~0.35–0.37
#   Proposed (hier. tf.) WER ~0.31–0.33   ← must beat MLP by ≥0.02
#   Oracle               WER ~0.24
#
# Proposed loss recipe: primary=1.0, aux_ce=0.3, soft_ce=0.5, tau=1.5, class_balanced=true
# Baseline MLP recipe:  primary=0.0, aux_ce=1.0, soft_ce=0.0, class_balanced=true

_target_: src.experiments.ami_main_results.AMIMainResultsExperiment
parent_run_name: ami_main_results
seed: 42

trainer:
  _target_: pytorch_lightning.Trainer
  max_epochs: 50
  accelerator: auto
  devices: auto
  deterministic: true
  log_every_n_steps: 50
  precision: bf16-mixed

data:
  _target_: src.data.ami.AMIDataModule
  parquet_path: data/processed/edinburghcstr_ami/combined_features_with_transcripts.parquet
  train_ratio: 0.8
  val_ratio: 0.1
  batch_size: 128
  num_workers: 4
  max_seq_len: 2000
  eager_load: false   # set true on high-RAM GPU host
  seed: 42
