# EXPLORATORY — synthetic with num_regimes=2 (3 seeds).
# Easiest case: pooled summary already tells you nearly everything,
# so MLP-pool should be near oracle and HT's edge should be small.

defaults:
  - /trainer: default
  - /data: synthetic
  - _self_

_target_: src.experiments.base.BaseExperiment
parent_run_name: explore_v1
seed: 42
seeds: [42, 0, 1337]
fixed_data_split: false

trainer:
  max_epochs: 30
  precision: 32

data:
  parquet_path: data/processed/synthetic_R2_T128_n050/combined_features.parquet
  num_samples: 10000
  num_regimes: 2
  frame_length: 128
  noise_std: 0.5
  batch_size: 256

stats:
  metric: wer_mean
  tests:
    - _target_: src.stats.paired_t.NadeauBengioCorrectedTTest
      alpha: 0.05

child_runs:
  - _target_: src.models.baselines.RandomBaseline
    name: random
  - _target_: src.models.baselines.OracleBaseline
    name: oracle
  - _target_: src.models.mlp.MLPPoolSelectorLightning
    name: mlp_pool_full_recipe
    primary_weight: 1.0
    aux_ce_weight: 0.3
    soft_ce_weight: 0.5
    soft_ce_temperature: 1.5
    class_balanced_loss: true
    early_stopping_patience: 5
  - _target_: src.models.transformer.ASRModelSelectorLightning
    name: hierarchical_transformer
    primary_weight: 1.0
    aux_ce_weight: 0.3
    soft_ce_weight: 0.5
    soft_ce_temperature: 1.5
    class_balanced_loss: true
    early_stopping_patience: 5
