# Lightweight Local Testing Experiment
#
# This configuration runs the original proposed architecture (Hierarchical Transformer)
# and baselines, but with miniature parameters so it executes instantly on a local machine.
#
# Usage:
#   uv run python scripts/create_local_parquet.py
#   make run CONFIG=local_test

defaults:
  - /trainer: default
  - _self_

_target_: src.experiments.base.BaseExperiment
parent_run_name: local_test_v1
seed: 42
seeds: [42, 0, 2]
fixed_data_split: false

# Override the global root precision to medium for this specific test
float32_matmul_precision: "medium"

trainer:
  max_epochs: 10
  accelerator: auto
  devices: 1
  precision: "32" # Use 32 for CPU/MPS compatibility
  log_every_n_steps: 1

# Override data to point directly to our lightweight generated parquet
data:
  _target_: src.data.base.ASRDataModule
  parquet_path: data/processed/local_test.parquet
  batch_size: 16
  max_seq_len: 200
  eager_load: true
  num_workers: 0

stats:
  metric: wer_mean
  tests:
    - _target_: src.stats.paired_t.NadeauBengioCorrectedTTest
      alpha: 0.05

child_runs:
  - _target_: src.models.transformer.ASRModelSelectorLightning
    name: hierarchical_transformer_light
    d_model: 64
    n_heads: 2
    stage1_layers: 1
    stage2_layers: 1
    ffn_dim: 128
    primary_weight: 1.0
    aux_ce_weight: 0.3
    soft_ce_weight: 0.5
    soft_ce_temperature: 1.5
    class_balanced_loss: true
    early_stopping_patience: 2

  - _target_: src.models.baselines.OracleBaseline
    name: oracle

  - _target_: src.models.baselines.RandomBaseline
    name: random

  - _target_: src.models.mlp.MLPPoolSelectorLightning
    name: mlp_pool_light
    d_hidden: 64
    n_layers: 1
    primary_weight: 0.0
    aux_ce_weight: 1.0
    soft_ce_weight: 0.0
    class_balanced_loss: true
    early_stopping_patience: 2
