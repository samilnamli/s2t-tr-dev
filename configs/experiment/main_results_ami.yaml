# AMI main results — 8 training-free baselines + 2 trainable selectors.
#
# Hypothesis (manuscript):
#   single-best   ~0.40    random/w-random ~0.40
#   ROVER/w-ROVER ~0.35-0.37
#   MLP pool      ~0.35-0.37
#   Proposed      ~0.31-0.33   (must beat MLP by ≥0.02)
#   Oracle        ~0.24

defaults:
  - /trainer: default
  - /data: ami
  - _self_

_target_: src.experiments.base.BaseExperiment
parent_run_name: v1
# Each entry in ``seeds`` re-derives BOTH the train/val/test split and the
# model init (the precondition for the Nadeau-Bengio corrected paired t-test).
# Set ``fixed_data_split: true`` to revert to the legacy "split fixed at
# ``seed``, only model varies" behaviour — but expect the stat test to log a
# warning that its assumptions are violated in that mode.
seed: 42 # data-split anchor (only used when fixed_data_split=true)
seeds: [42, 0, 2, 1337, 31415, 11235, 12321, 27182, 1618, 10101, 7777, 86400, 98765, 34567, 42069, 2026] # (split, model) seeds — vary together by default
fixed_data_split: false

# Override the global root precision to medium for this specific test
float32_matmul_precision: "medium"

trainer:
  max_epochs: 50
  precision: bf16-mixed

data:
  # Tuned for Blackwell 6000 (96 GB). Bump if you have headroom.
  batch_size: 256
  max_seq_len: 2000
  eager_load: true
  num_workers: 0 # eager mode keeps features in parent RAM; workers add IPC overhead.

stats:
  metric: wer_mean
  tests:
    - _target_: src.stats.paired_t.NadeauBengioCorrectedTTest
      alpha: 0.05

child_runs:
  - _target_: src.models.transformer.ASRModelSelectorLightning
    name: hierarchical_transformer
    primary_weight: 1.0
    aux_ce_weight: 0.3
    soft_ce_weight: 0.5
    soft_ce_temperature: 1.5
    class_balanced_loss: true
    early_stopping_patience: 5
  - _target_: src.models.baselines.SingleModelBaseline
    name: single_hubert
    model_idx: 0
  - _target_: src.models.baselines.SingleModelBaseline
    name: single_whisper
    model_idx: 1
  - _target_: src.models.baselines.SingleModelBaseline
    name: single_wav2vec2
    model_idx: 2
  - _target_: src.models.baselines.RandomBaseline
    name: random
  - _target_: src.models.baselines.WeightedRandomBaseline
    name: weighted_random
  - _target_: src.models.baselines.OracleBaseline
    name: oracle
  - _target_: src.models.baselines.ROVERBaseline
    name: rover
  - _target_: src.models.baselines.WeightedROVERBaseline
    name: weighted_rover
  - _target_: src.models.mlp.MLPPoolSelectorLightning
    name: mlp_pool_hard_ce
    primary_weight: 0.0
    aux_ce_weight: 1.0
    soft_ce_weight: 0.0
    class_balanced_loss: true
    early_stopping_patience: 5