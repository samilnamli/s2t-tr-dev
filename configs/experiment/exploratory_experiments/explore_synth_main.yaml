# EXPLORATORY — synthetic main comparison + small loss ablation (4 seeds).
# Purpose: refresh Table tab:synthetic with reproducible numbers and add
#   a couple of loss-ablation rows specific to the synthetic regime.
#   Default synthetic params (R=4, T=128, noise=0.5).

defaults:
  - /trainer: default
  - /data: synthetic
  - _self_

_target_: src.experiments.base.BaseExperiment
parent_run_name: explore_v1
seed: 42
seeds: [42, 0, 1, 2]
fixed_data_split: false

trainer:
  max_epochs: 30
  precision: 32

data:
  parquet_path: data/processed/synthetic_main_R4_T128_n050/combined_features.parquet
  num_samples: 10000
  num_regimes: 4
  frame_length: 128
  noise_std: 0.5
  batch_size: 256

stats:
  metric: wer_mean
  tests:
    - _target_: src.stats.paired_t.NadeauBengioCorrectedTTest
      alpha: 0.05

child_runs:
  - _target_: src.models.baselines.RandomBaseline
    name: random
  - _target_: src.models.baselines.WeightedRandomBaseline
    name: weighted_random
  - _target_: src.models.baselines.OracleBaseline
    name: oracle
  - _target_: src.models.baselines.SingleModelBaseline
    name: single_hubert
    model_idx: 0
  - _target_: src.models.baselines.SingleModelBaseline
    name: single_whisper
    model_idx: 1
  - _target_: src.models.baselines.SingleModelBaseline
    name: single_wav2vec2
    model_idx: 2
  - _target_: src.models.mlp.MLPPoolSelectorLightning
    name: mlp_pool_full_recipe
    primary_weight: 1.0
    aux_ce_weight: 0.3
    soft_ce_weight: 0.5
    soft_ce_temperature: 1.5
    class_balanced_loss: true
    early_stopping_patience: 5
  - _target_: src.models.mlp.MLPPoolSelectorLightning
    name: mlp_pool_hard_ce
    primary_weight: 0.0
    aux_ce_weight: 1.0
    soft_ce_weight: 0.0
    class_balanced_loss: true
    early_stopping_patience: 5
  - _target_: src.models.transformer.ASRModelSelectorLightning
    name: hierarchical_transformer_full
    primary_weight: 1.0
    aux_ce_weight: 0.3
    soft_ce_weight: 0.5
    soft_ce_temperature: 1.5
    class_balanced_loss: true
    early_stopping_patience: 5
  - _target_: src.models.transformer.ASRModelSelectorLightning
    name: hierarchical_transformer_wer_plus_soft_t01
    primary_weight: 1.0
    aux_ce_weight: 0.0
    soft_ce_weight: 0.5
    soft_ce_temperature: 0.1
    class_balanced_loss: true
    early_stopping_patience: 5
