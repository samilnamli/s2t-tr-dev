experiment_metadata:
  name: ablation_architecture_v2
  parent: ablation_architecture
  status: active
  created: 2026-05-01
  author: huseyin-karaca
  deprecated_for: null

  interpretation: |
    The v1 architecture ablation only covered three of the eight
    manuscript Tab. IV rows (Default + -bridge + -shared Stage 1) plus
    the MLP-pool baseline. The depth/width sweep (ell_stage1 = 1, 4;
    ell_stage2 = 2; d = 128, 512) was missing entirely. This made the
    ablation underpowered for justifying the default
    (ell_stage1=2, ell_stage2=1, d=256, shared+bridge) choice.

  rationale: |
    For Tab. IV we need:
      (1) every cell that appears in the manuscript table to have a
          training run, otherwise we cannot fill that cell;
      (2) the loss recipe to match the proposed-mix (lambda_wer=1,
          lambda_hard=0, lambda_soft=0.5, tau=0.1) so this ablation
          measures architecture only, not loss-by-architecture
          interaction; and
      (3) three seeds per row to express the WER as mean +/- std.
    The mlp_pool_baseline row is dropped here because Tab. IV is an
    "architecture choices inside the proposed router" table; the
    MLP-pool comparison lives in the main_results table.

  hypothesis: |
    On AMI test we expect (rough manuscript ranges):
      - Default                      : WER ~ 0.31-0.33, ~ 4.6 M params
      - - cross-attn bridge          : WER ~ 0.32-0.34, ~ 3.8 M params
      - - shared Stage 1             : WER ~ 0.31-0.33, ~ 7.5 M params
      - ell_stage1 = 1               : WER ~ 0.33-0.35, ~ 3.0 M params
      - ell_stage1 = 4               : WER ~ 0.32-0.34, ~ 7.8 M params
      - ell_stage2 = 2               : WER ~ 0.31-0.33, ~ 5.2 M params
      - d = 128                      : WER ~ 0.33-0.35, ~ 1.4 M params
      - d = 512                      : WER ~ 0.31-0.33, ~ 14.9 M params
    The Default config should sit at the Pareto knee: dropping the
    bridge OR halving d OR halving ell_stage1 should hurt WER by a
    visible (>=0.005) amount; doubling d or ell_stage1 should give
    only marginal WER gains at significant param cost. If the Pareto
    pattern fails (e.g. d=128 matches d=256), the architecture
    narrative needs revision.

# ---------------------------------------------------------------------------

parquet_path: "data/processed/edinburghcstr_ami/combined_features_with_transcripts.parquet"
skip_rover: true

shared:
  train_ratio: 0.8
  val_ratio: 0.1
  max_seq_len: 2000
  batch_size: 128
  num_workers: 4
  max_epochs: 50
  learning_rate: 1e-4
  precision: "bf16-mixed"
  eager_load: true
  allow_tf32: false
  test_average_epochs: 1
  early_stopping_patience: 8
  arch: "hierarchical_transformer"
  primary_weight: 1.0
  aux_ce_weight: 0.0
  soft_ce_weight: 0.5
  soft_ce_temperature: 0.1
  class_balanced_loss: true

methods:
  # Tab. IV row 1: Default (shared Stage 1, bridge, ell_stage1=2,
  # ell_stage2=1, d=256).
  - name: "arch_default_v2"
    d_model: 256
    n_heads: 4
    stage1_layers: 2
    stage2_layers: 1
    ffn_dim: 512
    dropout: 0.15
    no_cross_attention: false
    separate_stage1: false
    seed: [42, 2, 123]

  # Tab. IV row 2: drop the cross-attention bridge.
  - name: "arch_no_bridge_v2"
    d_model: 256
    n_heads: 4
    stage1_layers: 2
    stage2_layers: 1
    ffn_dim: 512
    dropout: 0.15
    no_cross_attention: true
    separate_stage1: false
    seed: [42, 2, 123]

  # Tab. IV row 3: drop Stage-1 weight sharing across experts.
  - name: "arch_separate_stage1_v2"
    d_model: 256
    n_heads: 4
    stage1_layers: 2
    stage2_layers: 1
    ffn_dim: 512
    dropout: 0.15
    no_cross_attention: false
    separate_stage1: true
    seed: [42, 2, 123]

  # Tab. IV row 4: shallow Stage-1 (single transformer layer).
  - name: "arch_stage1_layers_1_v2"
    d_model: 256
    n_heads: 4
    stage1_layers: 1
    stage2_layers: 1
    ffn_dim: 512
    dropout: 0.15
    no_cross_attention: false
    separate_stage1: false
    seed: [42, 2, 123]

  # Tab. IV row 5: deep Stage-1 (four transformer layers).
  - name: "arch_stage1_layers_4_v2"
    d_model: 256
    n_heads: 4
    stage1_layers: 4
    stage2_layers: 1
    ffn_dim: 512
    dropout: 0.15
    no_cross_attention: false
    separate_stage1: false
    seed: [42, 2, 123]

  # Tab. IV row 6: deeper Stage-2 (two transformer layers).
  - name: "arch_stage2_layers_2_v2"
    d_model: 256
    n_heads: 4
    stage1_layers: 2
    stage2_layers: 2
    ffn_dim: 512
    dropout: 0.15
    no_cross_attention: false
    separate_stage1: false
    seed: [42, 2, 123]

  # Tab. IV row 7: narrow model (d=128).
  - name: "arch_d_model_128_v2"
    d_model: 128
    n_heads: 4
    stage1_layers: 2
    stage2_layers: 1
    ffn_dim: 256
    dropout: 0.15
    no_cross_attention: false
    separate_stage1: false
    seed: [42, 2, 123]

  # Tab. IV row 8: wide model (d=512).
  - name: "arch_d_model_512_v2"
    d_model: 512
    n_heads: 4
    stage1_layers: 2
    stage2_layers: 1
    ffn_dim: 1024
    dropout: 0.15
    no_cross_attention: false
    separate_stage1: false
    seed: [42, 2, 123]
